# ═════════════════════════════════════════════════════════════
#  Контент бота: экраны, кнопки, продукты, тексты.
#  Код трогать не нужно — всё собирается здесь.
#
#  После правки отправь боту /reload — перезапуск не нужен.
#  Если в файле ошибка, бот скажет, где именно, и продолжит работать
#  на старой версии.
#
#  Оформление текста (HTML-теги Telegram):
#    <b>жирный</b>  <i>курсив</i>  <a href="https://...">ссылка</a>
#    Знак «меньше» пиши как &lt;  амперсанд как &amp;
#  {name} в тексте экрана заменится на имя человека.
#
#  ⚠️ Осталось заменить: tribute_url у платных продуктов.
# ═════════════════════════════════════════════════════════════


# ─────────────────────────────────────────────────────────────
#  ЭКРАНЫ
#
#  Каждый экран — текст + кнопки. Экран start — главное меню.
#  Кнопки идут рядами:
#    - {text: "Одна кнопка на всю ширину", screen: free}
#    - [{text: "Левая", screen: a}, {text: "Правая", screen: b}]
#
#  Что делает кнопка (ровно одно):
#    screen: id    — открыть другой экран
#    product: id   — бесплатный продукт сразу приходит в чат,
#                    платный открывает карточку с кнопкой «Купить»
#    url: https:// — открыть ссылку (в Telegram рядом появится ↗)
#    flow: id      — запустить сценарий из раздела flows (вопросы → готовый запрос)
#    my: true      — «Мои покупки»
#
#  Прямая ссылка на любой экран или продукт для постов и рилсов:
#    https://t.me/ИМЯ_БОТА?start=free        ← раздел с гайдами
#    https://t.me/ИМЯ_БОТА?start=g04_trip    ← гайд придёт сразу
# ─────────────────────────────────────────────────────────────

screens:

  start:
    photo: products/banners/start.png
    text: |
      Привет, {name} 🤍

      Здесь учат работать в <b>Claude</b> — с нуля и без терминов.

      Короткие уроки прямо в этом чате: читаешь → повторяешь в Claude → жмёшь «Дальше». Первые два модуля — бесплатно.
    buttons:
      - {text: "🎓 Начать обучение", screen: l1_1}
      - {text: "📚 Программа курса", screen: course}
      - {text: "✨ Готовый запрос под задачу", screen: tasks}
      - {text: "☰ Гайды, продукты и всё остальное", screen: more}

  # ── Курс «Claude с нуля» ──────────────────────────────────
  # Урок — экран. requires: course_full — урок откроется только после покупки курса.
  # Кнопка {text: "📋 …", copy: "текст"} копирует текст в одно касание (до 256 символов).
  course:
    photo: products/banners/course.png
    text: |
      <b>Claude с нуля</b> · программа

      <b>1 · Старт</b> — что умеет Claude, аккаунт, первый чат 🆓
      <b>2 · Запросы</b> — как просить, чтобы ответ был по делу 🆓
      <b>3 · Файлы и фото</b> — PDF, таблицы, скриншоты 🔒
      <b>4 · Проекты</b> — свой кабинет с инструкциями 🔒
      <b>5 · Артефакты</b> — документы, таблицы, мини-сайты 🔒
      <b>6 · Стили и память</b> — Claude пишет нужным тоном 🔒
      <b>7 · Практика</b> — 10 реальных задач 🔒

      Урок — 3–5 минут: читаешь, повторяешь в Claude, жмёшь «Дальше».
    buttons:
      - [{text: "1 · Старт", screen: l1_1}, {text: "2 · Запросы", screen: l2_1}]
      - [{text: "🔒 3 · Файлы", screen: l3_1}, {text: "🔒 4 · Проекты", screen: l4_1}]
      - [{text: "🔒 5 · Артефакты", screen: l5_1}, {text: "🔒 6 · Стили", screen: l6_1}]
      - {text: "🔒 7 · Практика", screen: l7_1}
      - {text: "⬅️ На главную", screen: start}

  l1_1:
    text: |
      <b>Модуль 1 · Урок 1 из 4</b>
      <b>Что такое Claude</b>

      Claude — нейросеть-собеседник от компании Anthropic. Пишешь ему обычным текстом — он отвечает.

      Что он умеет:
      • объяснить сложное простыми словами
      • написать или отредактировать текст: пост, письмо, план
      • разобрать файл: PDF, таблицу, скриншот
      • сделать документ, таблицу или схему прямо в чате

      Чего не умеет — знать всё наверняка. Claude иногда ошибается, причём уверенно. Всё важное проверяй в первоисточнике.
    buttons:
      - {text: "✅ Понятно — дальше", screen: l1_2}
      - {text: "⬅️ К программе", screen: course}

  l1_2:
    text: |
      <b>Модуль 1 · Урок 2 из 4</b>
      <b>Аккаунт и тарифы</b>

      Claude работает в браузере на <a href="https://claude.ai">claude.ai</a> и в приложениях для телефона и компьютера. Регистрация — по почте или через Google.

      <b>Бесплатный тариф</b> подходит для старта. У него есть лимит сообщений: он обновляется каждые 5 часов, а сколько сообщений влезет — зависит от нагрузки.
      <b>Платные тарифы</b> (Pro и выше) дают больше сообщений и функций.

      ⚠️ Claude работает не во всех странах — список на сайте Anthropic. В России и Беларуси он официально недоступен.

      Тарифы и лимиты меняются — сверяйся с claude.ai.
    buttons:
      - {text: "🌍 Страны, где работает Claude", url: "https://www.anthropic.com/supported-countries"}
      - {text: "✅ Дальше", screen: l1_3}
      - {text: "⬅️ Назад", screen: l1_1}

  l1_3:
    text: |
      <b>Модуль 1 · Урок 3 из 4</b>
      <b>Где что находится</b>

      • <b>Поле ввода</b> внизу — сюда пишешь запрос.
      • <b>«+» слева от поля</b> — прикрепить файл или фото.
      • <b>Меню модели</b> рядом с кнопкой отправки — какая модель отвечает и насколько глубоко думает. Для начала можно ничего не трогать.
      • <b>Слева</b> — история чатов и проекты.

      Каждый чат — отдельный разговор. Всё, что написано выше в этом чате, Claude учитывает в следующих ответах.

      Кнопки иногда меняются — ищи по смыслу.
    buttons:
      - {text: "✅ Дальше", screen: l1_4}
      - {text: "⬅️ Назад", screen: l1_2}

  l1_4:
    text: |
      <b>Модуль 1 · Урок 4 из 4</b>
      <b>Твой первый запрос</b>

      Открой новый чат в Claude и отправь запрос ниже — вместо скобок впиши своё.

      <pre>Объясни, что такое [тема, которая тебе интересна], как будто мне 12 лет. 5 коротких пунктов и один пример из жизни.</pre>

      Получилось? Теперь в том же чате напиши: «А теперь короче, в 2 предложениях».

      Видишь — ответ можно поправить, не начиная заново. Это главный навык, им займёмся в модуле 2.
    buttons:
      - {text: "📋 Скопировать запрос", copy: "Объясни, что такое [тема, которая тебе интересна], как будто мне 12 лет. 5 коротких пунктов и один пример из жизни."}
      - {text: "🎉 Модуль 1 пройден → Модуль 2", screen: l2_1}
      - {text: "⬅️ К программе", screen: course}

  l2_1:
    text: |
      <b>Модуль 2 · Урок 1 из 5</b>
      <b>Почему ответ бывает «водой»</b>

      Claude не знает тебя и твою задачу. Если запрос короткий, он отвечает «в среднем для всех».

      Сравни:
      ❌ «Куда поехать отдохнуть?»
      ✅ «Хочу к морю на 5 дней в мае, бюджет средний, без пересадок, вдвоём. Предложи 3 направления и сравни таблицей: перелёт, погода, на что обратить внимание.»

      Второй запрос — про конкретных людей и конкретную поездку. И ответ будет про них.
    buttons:
      - {text: "✅ Дальше", screen: l2_2}
      - {text: "⬅️ К программе", screen: course}

  l2_2:
    text: |
      <b>Модуль 2 · Урок 2 из 5</b>
      <b>Формула запроса</b>

      Хороший запрос отвечает на пять вопросов:
      1. <b>Что сделать</b> — «сравни», «составь план», «перепиши»
      2. <b>Контекст</b> — кто ты и зачем тебе это
      3. <b>Ограничения</b> — бюджет, срок, объём
      4. <b>Чего не нужно</b> — «без терминов», «без общих советов»
      5. <b>Формат</b> — список, таблица, 3 варианта

      Не обязательно все пять сразу. Но каждый добавленный пункт делает ответ точнее.

      Попробуй шаблон: скопируй, заполни скобки и отправь.
    buttons:
      - {text: "📋 Скопировать шаблон", copy: "Задача: [что сделать]. Контекст: [кто я и зачем]. Ограничения: [бюджет, срок, объём]. Не нужно: [чего избегать]. Формат: [список / таблица / 3 варианта]."}
      - {text: "✅ Дальше", screen: l2_3}
      - {text: "⬅️ Назад", screen: l2_1}

  l2_3:
    text: |
      <b>Модуль 2 · Урок 3 из 5</b>
      <b>Поправки вместо нового чата</b>

      Первый ответ — черновик. Его не переписывают с нуля, а правят в том же чате:
      • «Сократи вдвое»
      • «Объясни проще, без терминов»
      • «Сделай таблицей»
      • «Учти, что [новое условие]»
      • «Дай 3 разных варианта»

      Одна поправка за раз — так видно, что именно сработало.

      <b>Новый чат</b> нужен, когда начинаешь новую тему или когда переписка стала очень длинной и ответы «поплыли».
    buttons:
      - {text: "✅ Дальше", screen: l2_4}
      - {text: "⬅️ Назад", screen: l2_2}

  l2_4:
    text: |
      <b>Модуль 2 · Урок 4 из 5</b>
      <b>Пусть Claude спросит тебя</b>

      Не знаешь, что написать в запросе? Поменяйтесь ролями: пусть Claude сам задаст вопросы.

      <pre>Я хочу [задача]. Прежде чем отвечать, задай мне 5 вопросов — по одному, — чтобы ответ был точно под меня.</pre>

      Отвечай коротко и честно. После пятого вопроса Claude соберёт ответ из твоих же слов.
    buttons:
      - {text: "📋 Скопировать запрос", copy: "Я хочу [задача]. Прежде чем отвечать, задай мне 5 вопросов — по одному, — чтобы ответ был точно под меня."}
      - {text: "✅ Дальше", screen: l2_5}
      - {text: "⬅️ Назад", screen: l2_3}

  l2_5:
    text: |
      <b>Модуль 2 · Урок 5 из 5</b>
      <b>Проверяй ответы</b>

      Claude может ошибиться и звучать при этом уверенно. Особенно в цифрах, ценах, датах, законах и названиях.

      Что помогает:
      • спросить: «Где в ответе ты не уверен? Что мне проверить самой/самому?»
      • попросить источники — и открыть их
      • всё, где ошибка стоит денег или здоровья, — проверять в первоисточнике или у специалиста

      Это не недостаток тебя как пользователя — так работают все нейросети.
    buttons:
      - {text: "📋 Скопировать вопрос-проверку", copy: "Где в твоём ответе ты не уверен? Что мне стоит проверить самостоятельно и где?"}
      - {text: "🎉 Модуль 2 пройден → Модуль 3", screen: l3_1}
      - {text: "⬅️ К программе", screen: course}

  l3_1:
    requires: course_full
    text: |
      <b>Модуль 3 · Урок 1 из 3</b>
      <b>Как загрузить файл</b>

      Три способа:
      • нажми <b>«+»</b> слева внизу у поля ввода → «Add files or photos» (в русском интерфейсе — по смыслу «Добавить файлы или фото»)
      • перетащи файл прямо в окно чата
      • вставь скриншот из буфера обмена

      Что можно загружать: PDF, Word, TXT, CSV, картинки (JPEG, PNG, GIF, WebP). Таблицы Excel — когда в настройках включено выполнение кода.

      По справке Claude: до 20 файлов в одном чате, до 500 МБ каждый, PDF — до 1000 страниц. Лимиты могут меняться.
    buttons:
      - {text: "✅ Дальше", screen: l3_2}
      - {text: "⬅️ К программе", screen: course}

  l3_2:
    requires: course_full
    text: |
      <b>Модуль 3 · Урок 2 из 3</b>
      <b>Что спросить у файла</b>

      Загрузил файл — дальше всё как с обычным запросом: что сделать, в каком виде.

      <b>Длинный документ</b> → пересказ главного
      <b>Два файла</b> → сравнение
      <b>Скриншот или фото</b> → вытащить текст и цифры

      Ниже три готовых запроса — скопируй нужный.
    buttons:
      - {text: "📋 Пересказать документ", copy: "Перескажи этот документ в 5 пунктах: главное, сроки, суммы и что от меня требуется."}
      - {text: "📋 Сравнить два файла", copy: "Сравни эти два файла: что совпадает, что отличается. Таблицей: пункт — файл 1 — файл 2."}
      - {text: "📋 Цифры со скриншота", copy: "Вытащи со скриншота все цифры и подписи к ним и сделай таблицу."}
      - {text: "✅ Дальше", screen: l3_3}
      - {text: "⬅️ Назад", screen: l3_1}

  l3_3:
    requires: course_full
    text: |
      <b>Модуль 3 · Урок 3 из 3</b>
      <b>Что не стоит загружать</b>

      Прежде чем отправить файл, подумай, что в нём есть:
      • паспорт и другие документы с личными данными
      • банковские данные, пароли, коды
      • чужие переписки и фото без согласия
      • медицинские документы — только если без них никак

      Если нужна только часть — вырежи её или закрась личное на скриншоте. Claude хватит той информации, которая нужна для задачи.
    buttons:
      - {text: "🎉 Модуль 3 пройден → Модуль 4", screen: l4_1}

  l4_1:
    requires: course_full
    text: |
      <b>Модуль 4 · Урок 1 из 4</b>
      <b>Что такое проект</b>

      Проект — отдельное рабочее пространство в Claude. У него свои чаты, свои инструкции и свои файлы.

      Зачем: чтобы не объяснять одно и то же в каждом новом чате. Рассказал один раз в настройках проекта — и Claude учитывает это во всех чатах внутри него.

      Примеры проектов:
      • «Учёба» — с конспектами и списком тем
      • «Поездка» — с билетами, бронями и пожеланиями
      • «Тексты» — с образцами того, как ты пишешь

      Проекты есть и на бесплатном тарифе — там их можно создать до пяти.
    buttons:
      - {text: "✅ Дальше", screen: l4_2}
      - {text: "⬅️ К программе", screen: course}

  l4_2:
    requires: course_full
    text: |
      <b>Модуль 4 · Урок 2 из 4</b>
      <b>Создаём проект</b>

      1. Слева в меню открой <b>Projects</b> (Проекты) — или перейди на claude.ai/projects.
      2. Нажми <b>«+ New Project»</b>.
      3. Впиши название и короткое описание — например, «Поездка в мае: маршрут и бюджет».

      Готово — внутри проекта можно начинать чаты. Но пока он ничем не отличается от обычного чата. В следующих двух уроках добавим ему «память»: инструкции и файлы.

      Кнопки могут называться иначе — ищи по смыслу.
    buttons:
      - {text: "✅ Дальше", screen: l4_3}
      - {text: "⬅️ Назад", screen: l4_1}

  l4_3:
    requires: course_full
    text: |
      <b>Модуль 4 · Урок 3 из 4</b>
      <b>Инструкции проекта</b>

      Инструкции — это то, что Claude читает перед каждым ответом в этом проекте.

      Где: внутри проекта нажми <b>«Set project instructions»</b>, впиши текст и нажми <b>«Save instructions»</b>.

      Что писать:
      • зачем этот проект
      • кто ты и какой у тебя уровень
      • как отвечать: коротко или подробно, каким тоном, в каком виде

      Скопируй шаблон и заполни скобки.
    buttons:
      - {text: "📋 Скопировать шаблон инструкции", copy: "Ты помогаешь мне с [тема проекта]. Я [кто я, мой уровень]. Отвечай [коротко / подробно], на «ты», без лишних терминов. Если данных не хватает — сначала задай вопросы."}
      - {text: "✅ Дальше", screen: l4_4}
      - {text: "⬅️ Назад", screen: l4_2}

  l4_4:
    requires: course_full
    text: |
      <b>Модуль 4 · Урок 4 из 4</b>
      <b>Файлы проекта</b>

      Справа в проекте есть блок знаний. Нажми <b>«+»</b> и добавь документы: конспекты, брони, образцы текстов, таблицы.

      ⚠️ Важно: чаты внутри проекта не видят друг друга. Общее у них только то, что лежит в инструкциях и файлах проекта. Нашёл в чате что-то ценное — добавь в файлы проекта.

      <b>Задание модуля</b>
      1. Создай проект под свою реальную задачу.
      2. Добавь инструкцию по шаблону из прошлого урока.
      3. Загрузи один файл.
      4. Задай в проекте вопрос по этому файлу — и посмотри, как ответ учитывает инструкцию.
    buttons:
      - {text: "🎉 Модуль 4 пройден → Модуль 5", screen: l5_1}
      - {text: "⬅️ К программе", screen: course}

  l5_1:
    requires: course_full
    text: |
      <b>Модуль 5 · Урок 1 из 4</b>
      <b>Что такое артефакт</b>

      Артефакт — это то, что Claude делает для тебя и что можно показать другим: документ, таблица, схема, презентация, небольшой сайт или интерактивный инструмент вроде калькулятора.

      Он открывается в отдельной панели рядом с чатом. Текст ответа — слева, готовая вещь — справа.

      Когда пригодится: нужен не совет, а результат — чек-лист, который распечатаешь; таблица, которую отправишь; калькулятор, которым будешь пользоваться.
    buttons:
      - {text: "✅ Дальше", screen: l5_2}
      - {text: "⬅️ К программе", screen: course}

  l5_2:
    requires: course_full
    text: |
      <b>Модуль 5 · Урок 2 из 4</b>
      <b>Как включить</b>

      Артефакты доступны на всех тарифах, включая бесплатный. Но по справке Claude для них должны быть включены две функции: выполнение кода в облаке и создание файлов.

      Где проверить: <b>Settings → Capabilities</b> (Настройки → Возможности). Включи обе.

      Если артефакт не появляется — загляни туда первым делом. Названия пунктов могут меняться — ищи по смыслу.
    buttons:
      - {text: "✅ Дальше", screen: l5_3}
      - {text: "⬅️ Назад", screen: l5_1}

  l5_3:
    requires: course_full
    text: |
      <b>Модуль 5 · Урок 3 из 4</b>
      <b>Что попросить</b>

      Скажи прямо, какую вещь ты хочешь получить, и для чего она.

      <b>Документ</b> — чек-лист, план, инструкция
      <b>Инструмент</b> — калькулятор, трекер, тест
      <b>Схема</b> — как устроен процесс или день

      Три запроса ниже — скопируй любой и посмотри, что получится.
    buttons:
      - {text: "📋 Чек-лист для печати", copy: "Сделай чек-лист сборов в поездку на 5 дней в виде документа, который удобно распечатать. Сгруппируй: документы, одежда, уход, техника."}
      - {text: "📋 Калькулятор бюджета", copy: "Сделай интерактивный калькулятор бюджета на месяц: я ввожу доходы и расходы по категориям, он показывает остаток и долю каждой категории."}
      - {text: "📋 Схема процесса", copy: "Нарисуй схему: как подготовиться к переезду — от поиска жилья до первой ночи на новом месте. Этапы и что сделать на каждом."}
      - {text: "✅ Дальше", screen: l5_4}
      - {text: "⬅️ Назад", screen: l5_2}

  l5_4:
    requires: course_full
    text: |
      <b>Модуль 5 · Урок 4 из 4</b>
      <b>Как дорабатывать</b>

      Артефакт правится так же, как текст, — поправками в том же чате:
      • «Сделай заголовки крупнее»
      • «Добавь колонку „Срок“»
      • «Убери третий раздел»
      • «Сделай в спокойных цветах»

      Над панелью артефакта есть кнопки — например, чтобы скопировать или скачать результат. Набор зависит от того, что получилось.

      <b>Задание модуля</b>
      Попроси Claude сделать одну вещь, которой ты правда воспользуешься на этой неделе, и доведи её двумя поправками.
    buttons:
      - {text: "🎉 Модуль 5 пройден → Модуль 6", screen: l6_1}
      - {text: "⬅️ К программе", screen: course}

  l6_1:
    requires: course_full
    text: |
      <b>Модуль 6 · Урок 1 из 4</b>
      <b>Готовые стили ответа</b>

      Стиль меняет то, как Claude пишет, — не меняя смысл.

      Где: меню инструментов слева внизу у поля ввода → <b>«Use style»</b>. Готовые стили:
      • <b>Normal</b> — обычный ответ
      • <b>Concise</b> — короче и прямее
      • <b>Formal</b> — чётко и официально
      • <b>Explanatory</b> — подробно, чтобы разобраться в новой теме

      Учишь новое — попробуй Explanatory. Нужна выжимка — Concise.
    buttons:
      - {text: "✅ Дальше", screen: l6_2}
      - {text: "⬅️ К программе", screen: course}

  l6_2:
    requires: course_full
    text: |
      <b>Модуль 6 · Урок 2 из 4</b>
      <b>Свой стиль — по образцу</b>

      Можно научить Claude писать так, как пишешь ты.

      1. В том же меню стилей нажми <b>«Create and edit styles»</b> → <b>«Create custom style»</b>.
      2. <b>«Add writing example»</b> — загрузи файл или вставь 2–3 своих текста.
      3. Нажми <b>«Create style»</b> — Claude разберёт образцы и соберёт стиль.

      Нет образцов? Выбери <b>«Describe style instead»</b> и опиши словами: «коротко, тепло, без канцелярита».

      Стиль можно потом переименовать, поправить или удалить.
    buttons:
      - {text: "✅ Дальше", screen: l6_3}
      - {text: "⬅️ Назад", screen: l6_1}

  l6_3:
    requires: course_full
    text: |
      <b>Модуль 6 · Урок 3 из 4</b>
      <b>Инструкции для всех чатов</b>

      Есть настройки, которые работают во всех чатах сразу — не только в одном проекте.

      Где: нажми на свои инициалы слева внизу → <b>Settings</b> → <b>«Instructions for Claude»</b>.

      Разница:
      • <b>инструкции в профиле</b> — для всех чатов
      • <b>инструкции проекта</b> — только для чатов внутри проекта

      Пиши сюда то, что верно всегда: язык, тон, длина ответов.
    buttons:
      - {text: "📋 Скопировать шаблон", copy: "Я [кто я и чем занимаюсь]. Отвечай на русском, на «ты», коротко и по делу: сначала главное, потом детали. Если не уверен в факте — так и скажи."}
      - {text: "✅ Дальше", screen: l6_4}
      - {text: "⬅️ Назад", screen: l6_2}

  l6_4:
    requires: course_full
    text: |
      <b>Модуль 6 · Урок 4 из 4</b>
      <b>Память</b>

      Claude умеет запоминать полезный контекст между чатами: чем ты занимаешься, над чем работаешь, как тебе удобнее получать ответы.

      По справке Claude:
      • память включена по умолчанию на тарифах Free, Pro и Max
      • всё, что запомнено, видно в <b>Settings → Memory</b> — там можно прочитать, поправить или удалить любую тему
      • личные чувствительные темы — здоровье, политика, религия и подобное — по умолчанию не сохраняются
      • поиск по прошлым чатам есть на платных тарифах

      <b>Задание модуля</b>
      Заполни инструкции в профиле по шаблону, загляни в Settings → Memory и убери то, что Claude помнить не нужно.
    buttons:
      - {text: "🎉 Модуль 6 пройден → Практика", screen: l7_1}
      - {text: "⬅️ К программе", screen: course}

  l7_1:
    requires: course_full
    text: |
      <b>Модуль 7 · Практика 1–2 из 10</b>

      <b>1. Разобрать сложный документ</b>
      Договор, письмо из банка, инструкция к технике. Загрузи файл и попроси пересказ простыми словами.
      Довести: «Какие пункты мне стоит уточнить, прежде чем подписывать?»

      <b>2. Спланировать поездку</b>
      Даты, бюджет, с кем едешь — и Claude соберёт маршрут по дням.
      Довести: «Сделай таблицей и отметь, что нужно бронировать заранее».

      Цены и правила въезда всегда проверяй на официальных сайтах.
    buttons:
      - {text: "📋 Запрос 1 · документ", copy: "Перескажи этот документ простыми словами: о чём он, какие у меня обязательства, сроки и суммы. Отдельно — что выглядит необычно или рискованно."}
      - {text: "📋 Запрос 2 · поездка", copy: "Спланируй поездку: [куда], [даты], бюджет [сумма], едем [с кем]. Маршрут по дням: что посмотреть, где поесть, сколько времени на дорогу. Без спешки."}
      - {text: "✅ Дальше", screen: l7_2}
      - {text: "⬅️ К программе", screen: course}

  l7_2:
    requires: course_full
    text: |
      <b>Модуль 7 · Практика 3–4 из 10</b>

      <b>3. Меню на неделю и список покупок</b>
      Claude составит меню под твои продукты и время — и сразу список покупок по отделам магазина.
      Довести: «Убери то, что готовится дольше 30 минут».

      <b>4. Сравнить покупку</b>
      Две-три модели техники или вещи — и сравнение по тому, что важно именно тебе.
      Довести: «Какую возьмёшь ты и почему — в одном абзаце».

      Характеристики и цены проверяй на сайтах магазинов: Claude может ошибаться в цифрах.
    buttons:
      - {text: "📋 Запрос 3 · меню", copy: "Составь меню на 7 дней: завтрак, обед, ужин. Готовлю до 30 минут, дома есть [продукты]. В конце — список покупок по отделам магазина."}
      - {text: "📋 Запрос 4 · покупка", copy: "Сравни [модель 1] и [модель 2] для [зачем нужна вещь], бюджет до [сумма]. Таблицей: плюсы, минусы, для кого. Что важно проверить перед покупкой?"}
      - {text: "✅ Дальше", screen: l7_3}
      - {text: "⬅️ Назад", screen: l7_1}

  l7_3:
    requires: course_full
    text: |
      <b>Модуль 7 · Практика 5–6 из 10</b>

      <b>5. Бюджет на месяц</b>
      Вставь свои траты списком — Claude разложит их по категориям и покажет, где можно сэкономить без потерь.
      Довести: «Сделай это артефактом-таблицей, чтобы я мог(ла) вести её дальше».

      <b>6. Пост или объявление</b>
      Текст для соцсетей, объявление о продаже, приглашение на праздник.
      Довести: «Дай 3 варианта первой строки, которая цепляет».
    buttons:
      - {text: "📋 Запрос 5 · бюджет", copy: "Вот мои траты за месяц: [список]. Разложи по категориям, посчитай доли и предложи 3 способа сэкономить, не отказываясь от главного. Финансовых советов не нужно."}
      - {text: "📋 Запрос 6 · текст", copy: "Напиши [пост / объявление] о [тема] для [где опубликую]. Коротко, живо, без канцелярита. Дай 2 варианта: спокойный и более яркий."}
      - {text: "✅ Дальше", screen: l7_4}
      - {text: "⬅️ Назад", screen: l7_2}

  l7_4:
    requires: course_full
    text: |
      <b>Модуль 7 · Практика 7–8 из 10</b>

      <b>7. Сложное сообщение</b>
      Отказать, напомнить про долг, обозначить границу — без оправданий и без грубости.
      Довести: «Сделай ещё короче и спокойнее».

      <b>8. Разобраться в новой теме</b>
      Claude объяснит тему с нуля, а потом проверит тебя вопросами.
      Довести: «Где я ошибся(лась) и почему?»
    buttons:
      - {text: "📋 Запрос 7 · сообщение", copy: "Помоги написать сообщение: мне нужно [отказать / напомнить / попросить]. Пишу [кому]. Ситуация: [коротко]. Вежливо, коротко, без оправданий. Дай 3 варианта."}
      - {text: "📋 Запрос 8 · новая тема", copy: "Объясни [тема] с нуля простыми словами, с примерами из жизни. Потом задай мне 5 вопросов по одному, чтобы проверить, понял(а) ли я."}
      - {text: "✅ Дальше", screen: l7_5}
      - {text: "⬅️ Назад", screen: l7_3}

  l7_5:
    requires: course_full
    text: |
      <b>Модуль 7 · Практика 9–10 из 10</b>

      <b>9. Резюме или сопроводительное письмо</b>
      Загрузи своё резюме и текст вакансии — Claude подскажет, что подчеркнуть и что убрать.
      Довести: «Перепиши первый абзац письма так, чтобы его хотелось дочитать».

      <b>10. Свой ассистент</b>
      Собери всё из курса вместе: проект с инструкцией и файлами под задачу, которая у тебя повторяется, — учёба, работа с текстами, хозяйство.
      Довести: открой новый чат в проекте и проверь — Claude уже знает контекст?
    buttons:
      - {text: "📋 Запрос 9 · резюме", copy: "Вот моё резюме и текст вакансии. Что в резюме стоит подчеркнуть для этой вакансии, а что убрать? Затем напиши короткое сопроводительное письмо — без шаблонных фраз."}
      - {text: "📋 Запрос 10 · ассистент", copy: "Помоги мне написать инструкцию для проекта в Claude. Задача проекта: [что повторяется]. Задай мне 5 вопросов по одному, а потом собери инструкцию."}
      - {text: "🎓 Завершить курс", screen: course_done}
      - {text: "⬅️ Назад", screen: l7_4}

  course_done:
    requires: course_full
    text: |
      🎓 <b>Курс пройден</b>

      Теперь ты умеешь:
      • писать запросы, на которые Claude отвечает по делу
      • работать с файлами и фото
      • собирать проекты — своих ассистентов под задачи
      • получать готовые вещи: документы, таблицы, инструменты
      • настраивать стиль, инструкции и память

      Главное — не бросать: одна задача в день, и через неделю Claude станет привычкой.

      К любому уроку можно вернуться из программы.
    buttons:
      - {text: "📚 К программе", screen: course}
      - {text: "⬅️ На главную", screen: start}

  # ── Готовые запросы под задачу (сценарии) ─────────────────
  tasks:
    text: |
      <b>Готовый запрос под задачу</b>

      Ответь на 2–3 вопроса кнопками — и получишь запрос, который можно сразу вставить в Claude.
    buttons:
      - [{text: "✈️ Поездка", flow: trip}, {text: "🛍 Покупка", flow: buy}]
      - [{text: "💸 Деньги", flow: money}, {text: "💬 Сообщение", flow: message}]
      - {text: "⬅️ На главную", screen: start}

  # ── Всё остальное ─────────────────────────────────────────
  more:
    photo: products/banners/more.png
    text: |
      <b>Всё, что есть в боте</b>

      🎁 <b>5 гайдов</b> — бесплатно, забирай сразу
      ✨ <b>Личный ИИ-ассистент</b> — нейросеть, которая тебя знает
      💬 <b>Библиотека запросов</b> — 100 готовых шаблонов
    buttons:
      - {text: "🎓 Курс «Claude с нуля»", screen: course}
      - {text: "🎁 Бесплатно: 5 гайдов", screen: free}
      - [{text: "✨ Личный ИИ-ассистент", product: guide}, {text: "💬 Библиотека запросов", product: prompts}]
      - {text: "🤔 Ассистент или библиотека?", screen: choose}
      - [{text: "📖 Инструкции", screen: instructions}, {text: "❓ Вопросы", screen: faq}]
      - [{text: "👋 Кто я", screen: about}, {text: "✉️ Связь со мной", screen: contact}]
      - {text: "📦 Мои покупки", my: true}
      - {text: "⬅️ На главную", screen: start}

  # ── Бесплатные гайды ──────────────────────────────────────
  free:
    text: |
      Забирай 🤍 Каждый гайд — одна задача и готовый результат за несколько минут.

      <b>01</b> · первый результат без терминов и регистраций в десяти сервисах
      <b>02</b> · пять рамок, после которых ответ про тебя, а не про всех
      <b>03</b> · десять фраз-поправок, когда ответ не тот
      <b>04</b> · мой принцип поездок и запрос, который разложит бюджет
      <b>05</b> · как отказать, напомнить про долг или попросить без неловкости

      Лучше по порядку: каждый следующий опирается на предыдущий. Но можно и сразу тот, что нужен сейчас.
    photo: products/banners/free.png
    buttons:
      - {text: "01 · Первые 3 минуты с нейросетью", product: g01_first}
      - {text: "02 · Почему нейросеть отвечает водой", product: g02_water}
      - {text: "03 · Ответ не тот: 10 поправок", product: g03_fix}
      - {text: "04 · Бюджет поездки за 20 минут", product: g04_trip}
      - {text: "05 · Неловкое сообщение за 5 минут", product: g05_message}
      - {text: "⬅️ Назад", screen: more}

  q_start:
    text: |
      Тогда с гайда 01.

      Три минуты — и первый результат: нейросеть сравнит покупку под твой бюджет.
      Без регистрации в десяти сервисах и без терминов.
    buttons:
      - {text: "🎁 Забрать гайд 01", product: g01_first}
      - {text: "🤖 Какую нейросеть выбрать", screen: i_which}
      - {text: "⬅️ На главную", screen: start}

  # ── Инструкции ────────────────────────────────────────────
  instructions:
    text: |
      <b>Инструкции</b>

      Коротко о главном — от «что такое нейросеть» до «отвечает не то».

      Не нашлось ответа — напиши мне и приложи скриншот.
    buttons:
      - {text: "🧠 Совсем с нуля", screen: i_zero}
      - {text: "🤖 Какую нейросеть выбрать", screen: i_which}
      - {text: "📱 Регистрация в Claude", screen: i_account}
      - {text: "✍️ Как писать запросы", screen: i_prompts}
      - {text: "🔧 Если отвечает не то", screen: i_fix}
      - {text: "⬅️ Назад", screen: more}

  i_zero:
    text: |
      <b>Совсем с нуля</b>

      Нейросеть — программа, с которой общаются обычным текстом.
      Пишешь задачу — она выдаёт ответ.

      Устанавливать ничего не нужно: большинство работают в браузере или в приложении на телефоне.

      Первый шаг — простой вопрос из своей жизни.
      Не «напиши эссе», а «составь меню на неделю из того, что есть в холодильнике».
    buttons:
      - {text: "🎁 Гайд 01 · Первые 3 минуты", product: g01_first}
      - {text: "⬅️ К инструкциям", screen: instructions}

  i_which:
    text: |
      <b>Какую нейросеть выбрать</b>

      Подойдёт любая чат-нейросеть: гайды и шаблоны из бота — обычный текст, он работает везде.

      В России без обходных путей доступны, например:
      • <b>GigaChat</b> от Сбера
      • <b>Алиса</b> от Яндекса

      Начни с той, которой удобно пользоваться с телефона. Для первых задач важнее не выбор нейросети, а то, как ты пишешь запрос.

      Названия и доступность сервисов меняются — проверяй на их официальных сайтах.
    buttons:
      - {text: "🎁 Гайд 01 · Первые 3 минуты", product: g01_first}
      - {text: "⬅️ К инструкциям", screen: instructions}

  # Сверено со справкой Claude и списком стран Anthropic, сентябрь 2026
  i_account:
    text: |
      <b>Регистрация в Claude</b> · 5 минут

      1. Открой <a href="https://claude.ai">claude.ai</a> в браузере или приложение Claude.
      2. Введи почту и нажми «Continue with email» — или войди через Google.
      3. Подтверди почту по письму.
      4. Подтверди номер телефона кодом из СМС. Без этого шага аккаунт не создать.

      <b>Важно до начала</b>
      Claude работает не во всех странах. Нужно находиться в стране из <a href="https://www.anthropic.com/supported-countries">официального списка</a> — и номер телефона тоже нужен оттуда.
      В России и Беларуси Claude официально недоступен. Гайды из бота работают в любой чат-нейросети — например, в GigaChat или YandexGPT.

      Кнопки могут называться иначе — ищи по смыслу.
    buttons:
      - {text: "🎁 Гайд 01 · Первые 3 минуты", product: g01_first}
      - {text: "⬅️ К инструкциям", screen: instructions}

  i_prompts:
    text: |
      <b>Как писать запросы</b>

      Хороший запрос отвечает на пять вопросов:
      1. Что сделать — «сравни», «составь план»
      2. Для кого и зачем — «для двоих», «для работы»
      3. Ограничения — сумма, срок, количество
      4. Чего не нужно — «без сертификатов»
      5. В каком виде — «таблицей», «5 пунктов»

      Подробно, с примерами «было → стало», — в гайде 02.
    buttons:
      - {text: "🎁 Гайд 02 · Почему вода", product: g02_water}
      - {text: "⬅️ К инструкциям", screen: instructions}

  i_fix:
    text: |
      <b>Отвечает не то</b>

      Не начинай заново — поправь в том же чате:
      • «Сократи вдвое»
      • «Объясни проще, без терминов»
      • «Сделай таблицей»
      • «Учти, что…»

      Все 10 поправок — в гайде 03.
    buttons:
      - {text: "🎁 Гайд 03 · 10 поправок", product: g03_fix}
      - {text: "✉️ Написать мне", screen: contact}
      - {text: "⬅️ К инструкциям", screen: instructions}

  # ── Вопросы ───────────────────────────────────────────────
  faq:
    text: |
      <b>Вопросы</b>

      <b>Какую нейросеть выбрать?</b>
      Любую чат-нейросеть, которая тебе доступна. Всё из бота — обычный текст, он работает везде.

      <b>Нужно платить за нейросеть?</b>
      Для старта хватает бесплатных версий.

      <b>Гайды правда бесплатные?</b>
      Да. Нажимаешь кнопку — PDF приходит в чат.

      <b>Как оплатить?</b>
      Переводом на карту. Бот покажет сумму, реквизиты и номер заказа — переводишь и присылаешь сюда скриншот чека.

      <b>Когда придёт покупка?</b>
      После проверки чека, обычно в течение нескольких часов. PDF придёт в этот чат.

      <b>Потерялся файл?</b>
      Он всегда лежит в «Моих покупках».

      <b>Кнопка «Скопировать» в PDF не открывает шаблон?</b>
      Она ведёт в этот бот. Шаблон придёт, если продукт куплен с этого же аккаунта Telegram.

      <b>Какие данные хранит бот?</b>
      Имя и ID в Telegram и твои покупки — чтобы выдавать файлы. Скриншот чека видно только мне. Номер карты и пароли бот не получает.
    buttons:
      - {text: "🤔 Ассистент или библиотека?", screen: choose}
      - {text: "🤖 Какую нейросеть выбрать", screen: i_which}
      - {text: "📦 Мои покупки", my: true}
      - {text: "✉️ Не нашёлся ответ", screen: contact}
      - {text: "⬅️ Назад", screen: more}

  # ── Что выбрать ───────────────────────────────────────────
  # ⚠️ Цены здесь написаны текстом — меняешь price_rub у продукта, поменяй и тут.
  choose:
    text: |
      <b>Ассистент или библиотека?</b>

      ✨ <b>Личный ИИ-ассистент · 490 ₽</b>
      Настраиваешь один раз — и нейросеть отвечает тебе, а не всем: знает твой бюджет, вкус и как с тобой говорить. 10 готовых ассистентов с моими правилами.
      <i>Тебе, если пользуешься нейросетью часто и надоело объяснять одно и то же.</i>

      💬 <b>Библиотека запросов · 290 ₽</b>
      100 готовых шаблонов под конкретные задачи: вставляешь своё — получаешь ответ.
      <i>Тебе, если нужно быстро решить задачу и не думать, как её сформулировать.</i>

      Вместе работают лучше всего: ассистент знает тебя, шаблон — задачу.
    buttons:
      - {text: "✨ Личный ИИ-ассистент", product: guide}
      - {text: "💬 Библиотека запросов", product: prompts}
      - {text: "⬅️ Назад", screen: more}

  # ── Кто я ─────────────────────────────────────────────────
  # Только реальные факты — из «Доказательной базы» блога.
  about:
    text: |
      <b>Кто я</b>

      Я Юлия. Показываю, что красивая жизнь — поездки, эстетика, лёгкость — собирается головой и вкусом, а не выносливостью и большими деньгами.

      Красивая жизнь считается:
      • в Дубае взяли отель 4* вместо 5*, не экономили на двух экскурсиях, а на остаток купили подарки родным;
      • ноутбук для работы выбирала через нейросеть — сравнила модели под свой бюджет.

      Нейросеть для меня — не игрушка, а инструмент для решений. Здесь я собрала, как пользоваться ею так же: без терминов, по делу, под свою жизнь.
    buttons:
      - {text: "🎁 Забрать бесплатные гайды", screen: free}
      - {text: "✉️ Написать мне", screen: contact}
      - {text: "⬅️ Назад", screen: more}

  # ── Связь ─────────────────────────────────────────────────
