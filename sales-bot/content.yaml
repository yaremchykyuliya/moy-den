# ─────────────────────────────────────────────────────────────
#  Контент бота: все тексты и товары. Код трогать не нужно.
#
#  Оформление — HTML-теги Telegram:
#    <b>жирный</b>   <i>курсив</i>   <u>подчёркнутый</u>
#    <a href="https://...">ссылка</a>
#  Знак «меньше» пиши как &lt;  а амперсанд как &amp;
#
#  После правки файла отправь боту /reload (бот перезапускать не нужно).
#  Если в файле ошибка, бот скажет, где именно, и продолжит работать.
# ─────────────────────────────────────────────────────────────

texts:
  # {name} подставится имя человека из Telegram
  welcome: |
    Привет, {name}! 👋

    Здесь можно купить мои материалы по нейросетям — без сложных слов и воды.
    Оплата прямо в Telegram, продукт приходит сразу после оплаты.

  catalog: |
    <b>Каталог</b>
    Выбери, что тебе подходит 👇

  catalog_empty: Скоро здесь появятся продукты ✨

  my_purchases: |
    <b>Мои покупки</b>
    Нажми на продукт — пришлю его ещё раз.

  my_empty: Пока покупок нет. Загляни в каталог 🛍

  support: |
    <b>Поддержка</b>
    Если что-то не пришло или есть вопрос — напиши мне: @твой_ник
    Отвечаю в течение дня.

  # Команда /paysupport обязательна по правилам Telegram для оплаты звёздами
  paysupport: |
    <b>Вопросы по оплате</b>
    Напиши мне @твой_ник и приложи скриншот оплаты — разберусь и помогу.

  # {product} — название продукта
  thanks: |
    Оплата прошла, спасибо! 🎉
    Лови <b>{product}</b> 👇

  pay_prompt: Нажми «Оплатить». Продукт придёт в этот чат сразу после оплаты.

  # Два текста ниже показываются во всплывающем окне — не длиннее 200 символов
  pay_waiting: Пока не вижу оплату. Если оплата уже прошла — подожди минуту и нажми ещё раз.
  pay_canceled: Платёж отменён. Можно открыть продукт в каталоге и попробовать снова.

  already_bought: Этот продукт у тебя уже есть — отправляю ещё раз 👇

  delivery_error: |
    Ой, что-то пошло не так 😔
    Мне уже пришло уведомление, скоро пришлю всё вручную. Деньги не потеряются.


# ─────────────────────────────────────────────────────────────
#  Товары. Порядок здесь = порядок в каталоге.
#
#  id           — латиница, цифры, _ и -. Ссылка сразу на товар:
#                 https://t.me/ИМЯ_БОТА?start=id  (удобно ставить в постах)
#  price_rub    — цена в рублях (для ЮKassa)
#  price_stars  — цена в звёздах Telegram (для Stars)
#  photo        — необязательно: файл из папки products/ или https-ссылка
#  delivery     — что человек получит после оплаты:
#     type: file     value: путь к файлу, например products/guide.pdf
#     type: link     value: https-ссылка (Google Диск, Notion, платформа курса)
#     type: text     value: текст сообщения (промокод, инструкция)
#     type: channel  value: ID закрытого канала -100XXXXXXXXXX
#                    (бот должен быть админом канала с правом приглашать)
#
#  ⚠️ Ниже — ПРИМЕРЫ-заглушки, чтобы бот запустился. Замени на свои продукты.
# ─────────────────────────────────────────────────────────────

products:
  - id: guide
    title: Гайд «Нейросети с нуля»
    description: |
      Пошаговый гайд для тех, кто ни разу не открывал нейросети.

      Внутри:
      • как зарегистрироваться и не запутаться
      • 20 готовых запросов для работы и жизни
      • частые ошибки новичков и как их избежать
    price_rub: 990
    price_stars: 500
    delivery:
      type: link
      value: https://example.com/zamenite-na-svoyu-ssylku

  - id: prompts
    title: Пакет промптов
    description: |
      50 проверенных запросов для текстов, идей и учёбы.
      Копируешь — вставляешь — получаешь результат.
    price_rub: 490
    price_stars: 250
    delivery:
      type: text
      value: |
        Твой пакет промптов 👇
        https://example.com/zamenite-na-svoyu-ssylku

  # Пример выдачи файлом — положи файл в папку products/ и раскомментируй:
  # - id: checklist
  #   title: Чек-лист «Первый день с ИИ»
  #   description: Короткий чек-лист на одну страницу.
  #   price_rub: 290
  #   price_stars: 150
  #   photo: products/checklist-cover.jpg
  #   delivery:
  #     type: file
  #     value: products/checklist.pdf

  # Пример выдачи доступа в закрытый канал с курсом:
  # - id: course
  #   title: Мини-курс «ИИ в работе»
  #   description: 7 уроков в закрытом канале.
  #   price_rub: 2990
  #   price_stars: 1500
  #   delivery:
  #     type: channel
  #     value: "-1001234567890"
