# ─────────────────────────────────────────────────────────────
#  ПРОГРЕВ
#
#  Серия сообщений после ПЕРВОГО бесплатного гайда. Отсчёт — от момента,
#  когда человек забрал свой первый гайд.
#
#  after           — через сколько: 30m (минуты), 24h (часы), 3d (дни)
#  skip_if_bought  — не отправлять тем, кто уже купил эти продукты
#  text, buttons   — как у экранов
#
#  Сообщения уходят только в nurture_hours по часовому поясу TIMEZONE из .env.
#  Каждый шаг человек получит один раз. Шаг, добавленный позже, получат только
#  те, кто забрал гайд недавно, — старую базу он не заспамит.
# ─────────────────────────────────────────────────────────────

nurture_hours: "10-21"

nurture:
  - id: n1_day1
    after: 24h
    text: |
      Как успехи с гайдом?

      Если ответ получился не тот — это нормально. Чаще всего хватает одной поправки: «сократи», «учти, что…», «сделай таблицей».

      Все десять поправок — в гайде 03.
    buttons:
      - {text: "🎁 Гайд 03 · 10 поправок", product: g03_fix}
      - {text: "✉️ Не получается — напиши мне", screen: contact}

  - id: n2_day3
    after: 3d
    skip_if_bought: [guide]
    text: |
      Бесплатные гайды дают результат на одной задаче.

      Но каждый новый чат нейросеть начинает с нуля: не знает твой бюджет, вкус и то, как с тобой говорить.

      «Личный ИИ-ассистент» — один раз рассказать о себе и больше не объяснять. Внутри 10 готовых ассистентов с моими правилами.
    buttons:
      - {text: "📘 Посмотреть, что внутри", product: guide}

  - id: n3_day6
    after: 6d
    skip_if_bought: [prompts]
    text: |
      Не хочется каждый раз собирать запрос с нуля?

      В «Библиотеке запросов» 100 готовых шаблонов: от поездок и покупок до бюджета и сложных документов.
      Вставляешь своё — и поправлять приходится намного меньше 🤍
    buttons:
      - {text: "💬 Посмотреть шаблоны", product: prompts}


# ─────────────────────────────────────────────────────────────
#  СЛУЖЕБНЫЕ ТЕКСТЫ
# ─────────────────────────────────────────────────────────────

texts:
  my_purchases: |
    <b>Мои покупки</b>
    Нажми на продукт — пришлю ещё раз.

  my_empty: Покупок пока нет. Загляни в бесплатные гайды 🤍

  # {product} — название продукта
  thanks: |
    Оплата прошла, спасибо 🤍
    Держи <b>{product}</b>

  pay_prompt: Нажми «Оплатить». Продукт придёт в этот чат сразу после оплаты.

  # ── Выбор способа оплаты ── {product} — название
  pay_choose: Как удобнее оплатить <b>{product}</b>?

  # ── Tribute ── {product}, {amount}
  tribute_prompt: |
    <b>{product}</b> — {amount} ₽

    Оплата картой через Tribute.
    Сразу после оплаты Tribute пришлёт продукт в Telegram.

  # ── Перевод на карту ── {product}, {amount}, {order}, {details} (реквизиты из .env)
  transfer_prompt: |
    <b>{product}</b> — {amount} ₽

    Переведи <b>{amount} ₽</b> по реквизитам:
    {details}

    После перевода пришли сюда скриншот или файл чека — проверю поступление и пришлю продукт.
    Номер заказа: {order}

  transfer_received: |
    Чек по заказу №{order} у меня 🤍
    Проверю поступление и пришлю продукт сюда. Обычно это занимает несколько часов.

  transfer_rejected: |
    Перевод по заказу №{order} не нашёлся.
    Если деньги списались — напиши мне и приложи чек из банка, разберёмся.

  transfer_no_order: Если это чек об оплате — сначала выбери продукт и способ «Переводом на карту», потом пришли чек.

  # Перед чеком, который ты отправляешь покупателю ответом на заявку. {order}
  seller_receipt: "🧾 Чек об оплате заказа №{order}:"

  # ── Кнопка «Скопировать» из «Библиотеки запросов» ──
  template_hint: Коснись блока с текстом — он скопируется. Вставь в нейросеть и замени то, что в [квадратных скобках], на своё.
  lesson_locked: |
    🔒 Этот урок — в полном курсе. Модули 1–2 бесплатные, остальное открывается после покупки.
  template_locked: Этот шаблон — из «{product}». Он откроется сразу после покупки 🤍

  # Два текста ниже показываются во всплывающем окне — не длиннее 200 символов
  pay_waiting: Пока не вижу оплату. Если она уже прошла — подожди минуту и нажми ещё раз.
  pay_canceled: Платёж отменён. Можно открыть продукт заново и попробовать ещё раз.

  already_bought: Этот продукт у тебя уже есть — отправляю ещё раз.

  delivery_error: |
    Что-то пошло не так.
    Мне уже пришло уведомление — пришлю всё вручную. Деньги не потеряются.

  # Команда /paysupport обязательна по правилам Telegram для оплаты звёздами
  paysupport: |
    <b>Вопросы по оплате</b>
    Напиши мне @yuliya_serduykova и приложи скриншот оплаты — разберусь.
