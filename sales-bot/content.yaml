# ═════════════════════════════════════════════════════════════
#  Контент бота: экраны, кнопки, продукты, тексты.
#  Код трогать не нужно — всё собирается здесь.
#
#  После правки отправь боту /reload — перезапуск не нужен.
#  Если в файле ошибка, бот скажет, где именно, и продолжит работать
#  на старой версии.
#
#  Оформление текста (HTML-теги Telegram):
#    <b>жирный</b>  <i>курсив</i>  <a href="https://...">ссылка</a>
#    Знак «меньше» пиши как &lt;  амперсанд как &amp;
#  {name} в тексте экрана заменится на имя человека.
#
#  ⚠️ Платные продукты, цены, ссылки и @ник — ЗАГЛУШКИ. Замени на свои.
# ═════════════════════════════════════════════════════════════


# ─────────────────────────────────────────────────────────────
#  ЭКРАНЫ
#
#  Каждый экран — текст + кнопки. Экран start — главное меню.
#  Кнопки идут рядами:
#    - {text: "Одна кнопка на всю ширину", screen: free}
#    - [{text: "Левая", screen: a}, {text: "Правая", screen: b}]
#
#  Что делает кнопка (ровно одно):
#    screen: id    — открыть другой экран
#    product: id   — бесплатный продукт сразу приходит в чат,
#                    платный открывает карточку с кнопкой «Купить»
#    url: https:// — открыть ссылку (в Telegram рядом появится ↗)
#    my: true      — «Мои покупки»
#
#  Прямая ссылка на любой экран или продукт для постов и рилсов:
#    https://t.me/ИМЯ_БОТА?start=free        ← раздел с гайдами
#    https://t.me/ИМЯ_БОТА?start=g04_trip    ← гайд придёт сразу
# ─────────────────────────────────────────────────────────────

screens:

  start:
    text: |
      Привет, {name} 🤍

      Нейросети — это не про технологии. Это про время и решения.

      Здесь собрано, как начать с нуля и не утонуть в терминах.
      Пять гайдов — бесплатно, забирай сразу.
    buttons:
      - {text: "🎁 Бесплатно: 5 гайдов", screen: free}
      - {text: "🧭 С чего начать?", screen: quiz}
      - [{text: "📘 Нейросети с нуля", product: guide}, {text: "💬 Библиотека запросов", product: prompts}]
      - [{text: "📖 Инструкции", screen: instructions}, {text: "❓ Вопросы", screen: faq}]
      - {text: "📦 Мои покупки", my: true}
      - {text: "✉️ Связь со мной", screen: contact}

  # ── Бесплатные гайды ──────────────────────────────────────
  free:
    text: |
      Забирай 🤍

      Лучше по порядку: каждый следующий опирается на предыдущий.
      Но можно и сразу тот, что нужен сейчас.
    buttons:
      - {text: "01 · Первые 3 минуты с нейросетью", product: g01_first}
      - {text: "02 · Почему нейросеть отвечает водой", product: g02_water}
      - {text: "03 · Ответ не тот: 10 поправок", product: g03_fix}
      - {text: "04 · Бюджет поездки за 20 минут", product: g04_trip}
      - {text: "05 · Неловкое сообщение за 5 минут", product: g05_message}
      - {text: "⬅️ В меню", screen: start}

  # ── Квиз «С чего начать?» ─────────────────────────────────
  quiz:
    text: |
      Один вопрос, чтобы не листать всё подряд.

      Что тебе сейчас ближе?
    buttons:
      - {text: "Нейросетью пока не пользуюсь", screen: q_start}
      - {text: "Пробую, но выходит вода", screen: q_water}
      - {text: "Хочу спланировать поездку", screen: q_trip}
      - {text: "Надо написать неловкое сообщение", screen: q_message}
      - {text: "Хочу сразу систему", product: guide}
      - {text: "Хочу поговорить лично", screen: contact}
      - {text: "⬅️ В меню", screen: start}

  q_start:
    text: |
      Тогда с гайда 01.

      Три минуты — и первый результат: нейросеть сравнит покупку под твой бюджет.
      Без регистрации в десяти сервисах и без терминов.
    buttons:
      - {text: "🎁 Забрать гайд 01", product: g01_first}
      - {text: "⬅️ Назад", screen: quiz}

  q_water:
    text: |
      Вода в ответе — почти всегда от пустого запроса. Дело не в тебе.

      Гайд 02 — пять рамок, после которых ответ становится про тебя.
      Гайд 03 — что писать, если ответ всё равно не тот.
    buttons:
      - {text: "🎁 Гайд 02 · Почему вода", product: g02_water}
      - {text: "🎁 Гайд 03 · 10 поправок", product: g03_fix}
      - {text: "⬅️ Назад", screen: quiz}

  q_trip:
    text: |
      Сначала ощущение, потом прайс.

      В гайде 04 — мой принцип и готовый запрос: нейросеть разложит бюджет и покажет, на чём резать, а на чём нет.
    buttons:
      - {text: "🎁 Забрать гайд 04", product: g04_trip}
      - {text: "⬅️ Назад", screen: quiz}

  q_message:
    text: |
      Самое трудное — первая фраза.

      Гайд 05: отказать, напомнить про долг, перенести запись. Готовые запросы, три черновика на выбор.
    buttons:
      - {text: "🎁 Забрать гайд 05", product: g05_message}
      - {text: "⬅️ Назад", screen: quiz}

  # ── Инструкции ────────────────────────────────────────────
  instructions:
    text: |
      <b>Инструкции</b>

      Коротко о главном — от «что такое нейросеть» до «отвечает не то».

      Не нашлось ответа — напиши мне и приложи скриншот.
    buttons:
      - {text: "🧠 Совсем с нуля", screen: i_zero}
      - {text: "📱 Регистрация", screen: i_account}
      - {text: "✍️ Как писать запросы", screen: i_prompts}
      - {text: "🔧 Если отвечает не то", screen: i_fix}
      - {text: "⬅️ В меню", screen: start}

  i_zero:
    text: |
      <b>Совсем с нуля</b>

      Нейросеть — программа, с которой общаются обычным текстом.
      Пишешь задачу — она выдаёт ответ.

      Устанавливать ничего не нужно: большинство работают в браузере или в приложении на телефоне.

      Первый шаг — простой вопрос из своей жизни.
      Не «напиши эссе», а «составь меню на неделю из того, что есть в холодильнике».
    buttons:
      - {text: "🎁 Гайд 01 · Первые 3 минуты", product: g01_first}
      - {text: "⬅️ К инструкциям", screen: instructions}

  # ЗАГЛУШКА: впиши регистрацию в той нейросети, которой учишь
  i_account:
    text: |
      <b>Регистрация</b>

      Скоро здесь будет пошаговая регистрация — со скриншотами каждого шага.
    buttons:
      - {text: "⬅️ К инструкциям", screen: instructions}

  i_prompts:
    text: |
      <b>Как писать запросы</b>

      Хороший запрос отвечает на пять вопросов:
      1. Что сделать — «сравни», «составь план»
      2. Для кого и зачем — «для двоих», «для работы»
      3. Ограничения — сумма, срок, количество
      4. Чего не нужно — «без сертификатов»
      5. В каком виде — «таблицей», «5 пунктов»

      Подробно, с примерами «было → стало», — в гайде 02.
    buttons:
      - {text: "🎁 Гайд 02 · Почему вода", product: g02_water}
      - {text: "⬅️ К инструкциям", screen: instructions}

  i_fix:
    text: |
      <b>Отвечает не то</b>

      Не начинай заново — поправь в том же чате:
      • «Сократи вдвое»
      • «Объясни проще, без терминов»
      • «Сделай таблицей»
      • «Учти, что…»

      Все 10 поправок — в гайде 03.
    buttons:
      - {text: "🎁 Гайд 03 · 10 поправок", product: g03_fix}
      - {text: "✉️ Написать мне", screen: contact}
      - {text: "⬅️ К инструкциям", screen: instructions}

  # ── Вопросы ───────────────────────────────────────────────
  faq:
    text: |
      <b>Вопросы</b>

      <b>Нужно платить за нейросеть?</b>
      Для старта хватает бесплатных версий.

      <b>Гайды правда бесплатные?</b>
      Да. Нажимаешь кнопку — PDF приходит в чат.

      <b>Когда придёт покупка?</b>
      Картой через Tribute — сразу после оплаты.
      Переводом на карту — после проверки чека, обычно в течение нескольких часов.

      <b>Потерялся файл?</b>
      Он всегда лежит в «Моих покупках».
    buttons:
      - {text: "📦 Мои покупки", my: true}
      - {text: "✉️ Не нашёлся ответ", screen: contact}
      - {text: "⬅️ В меню", screen: start}

  # ── Связь ─────────────────────────────────────────────────
  contact:
    text: |
      Пиши напрямую — отвечаю в течение дня.
    buttons:
      - {text: "✉️ Написать мне", url: "https://t.me/your_username"}
      - {text: "⬅️ В меню", screen: start}

  # Пример партнёрской программы, как «Заработать со мной» у NIKSHEN.
  # Раскомментируй и добавь кнопку {text: "🤝 Заработать со мной", screen: partners} в start.
  # partners:
  #   text: |
  #     <b>Заработать со мной</b>
  #
  #     Рассказываешь о моих продуктах — получаешь процент с каждой продажи.
  #     Условия целиком — по ссылке.
  #   buttons:
  #     - {text: "📄 Читать условия", url: "https://example.com/partners"}
  #     - {text: "✉️ Написать и получить код", url: "https://t.me/your_username"}
  #     - {text: "⬅️ В меню", screen: start}


# ─────────────────────────────────────────────────────────────
#  ПРОДУКТЫ
#
#  id           — латиница, цифры, _ и -, до 28 символов
#  free: true   — бесплатный: приходит сразу по нажатию кнопки
#  followup     — только у бесплатных: сообщение с кнопками,
#                 которое бот пришлёт сразу после гайда
#  price_rub    — цена в рублях (для ЮKassa)
#  price_stars  — цена в звёздах Telegram (для Stars)
#  description  — описание для карточки (обязательно у платных)
#  photo        — обложка карточки: файл из products/ или https-ссылка
#  delivery     — что человек получит:
#     type: file     value: products/guide.pdf
#     type: link     value: https-ссылка (Google Диск, Notion, платформа)
#     type: text     value: текст сообщения
#     type: channel  value: "-100XXXXXXXXXX" — одноразовое приглашение
#                    в закрытый канал (бот — админ с правом приглашать)
#
#  PDF гайдов собираются из guides/*.md командой: python guides/build.py
# ─────────────────────────────────────────────────────────────

products:

  # ── Бесплатные гайды ──────────────────────────────────────
  - id: g01_first
    title: "Гайд 01 · Первые 3 минуты с нейросетью"
    free: true
    delivery:
      type: file
      value: products/01-pervye-3-minuty.pdf
    followup:
      text: |
        Попробуй прямо сейчас — это три минуты 🤍

        Получилось? Следующий шаг — понять, почему нейросеть иногда отвечает водой и как это исправить.
      buttons:
        - {text: "🎁 Гайд 02 · Почему вода", product: g02_water}
        - {text: "📘 Сразу систему: Нейросети с нуля", product: guide}

  - id: g02_water
    title: "Гайд 02 · Почему нейросеть отвечает водой"
    free: true
    delivery:
      type: file
      value: products/02-pochemu-voda.pdf
    followup:
      text: |
        Пять рамок — и ответ про тебя, а не про всех.

        Если ответ всё равно не тот — десять поправок в гайде 03.
      buttons:
        - {text: "🎁 Гайд 03 · 10 поправок", product: g03_fix}
        - {text: "📘 Нейросети с нуля", product: guide}

  - id: g03_fix
    title: "Гайд 03 · Ответ не тот: 10 поправок"
    free: true
    delivery:
      type: file
      value: products/03-otvet-ne-tot.pdf
    followup:
      text: |
        Сохрани шпаргалку — пригодится каждый день.

        Не хочешь подбирать поправки заново под каждую задачу? В «Библиотеке запросов» 50 готовых шаблонов.
      buttons:
        - {text: "💬 Библиотека запросов", product: prompts}
        - {text: "🎁 Гайд 04 · Бюджет поездки", product: g04_trip}

  - id: g04_trip
    title: "Гайд 04 · Бюджет поездки за 20 минут"
    free: true
    delivery:
      type: file
      value: products/04-byudzhet-poezdki.pdf
    followup:
      text: |
        Сначала ощущение, потом прайс.

        По тому же принципу раскладывается ремонт, крупная покупка, праздник. Как собирать такие запросы самостоятельно — в «Нейросетях с нуля».
      buttons:
        - {text: "📘 Нейросети с нуля", product: guide}
        - {text: "🎁 Гайд 05 · Неловкое сообщение", product: g05_message}

  - id: g05_message
    title: "Гайд 05 · Неловкое сообщение за 5 минут"
    free: true
    delivery:
      type: file
      value: products/05-nelovkoe-soobshchenie.pdf
    followup:
      text: |
        Все пять гайдов у тебя 🤍

        Дальше — система: как собрать запрос под любую свою задачу и проверять ответы. Это «Нейросети с нуля».
      buttons:
        - {text: "📘 Нейросети с нуля", product: guide}
        - {text: "💬 Библиотека запросов", product: prompts}

  # ── Платные ───────────────────────────────────────────────
  # Репозиторий публичный, поэтому PDF платных продуктов в git НЕ хранятся.
  # Положи файлы в папку products/paid/ на сервере, где работает бот.
  # Исходники — в guides/paid/, сборка: python guides/build.py
  #
  # Tribute:
  #   tribute_url         — ссылка на продукт в Tribute (⚠️ сейчас ЗАГЛУШКА)
  #   tribute_product_id  — номер продукта в Tribute, чтобы бот узнавал о покупках
  #   Цена в Tribute должна совпадать с price_rub.
  - id: guide
    title: Нейросети с нуля
    description: |
      Система вместо отдельных запросов. 5 уроков по 20–30 минут.

      Внутри:
      • как собрать свой запрос под любую задачу — без шаблонов
      • приём «пусть нейросеть спросит тебя», когда непонятно, с чего начать
      • как превратить удачный разговор в свой шаблон
      • где нейросеть ошибается чаще всего и 4 приёма проверки
      • 4 разбора от первого запроса до готового шаблона
      • чек-лист безопасности и план на неделю, чтобы навык закрепился

      PDF, 18 страниц. Придёт в этот чат сразу после оплаты.
    price_rub: 990
    price_stars: 500
    tribute_url: https://web.tribute.tg/p/ZAMENI
    # tribute_product_id: 123456
    delivery:
      type: file
      value: products/paid/neyroseti-s-nulya.pdf

  - id: prompts
    title: Библиотека запросов
    description: |
      50 шаблонов с пропусками — вставляешь своё и получаешь ответ.

      • поездки: направление, маршрут, бюджет, вещи, подарки
      • покупки: техника, отзывы, скидки, тарифы, база гардероба
      • сообщения: отказы, долги, поздравления, неудобные вопросы
      • планы: неделя, меню, праздник, трудный разговор
      • уход за собой: состав средств, ароматы, косметичка

      PDF, 15 страниц. Придёт в этот чат сразу после оплаты.
    price_rub: 490
    price_stars: 250
    tribute_url: https://web.tribute.tg/p/ZAMENI
    # tribute_product_id: 123457
    delivery:
      type: file
      value: products/paid/biblioteka-zaprosov.pdf


# ─────────────────────────────────────────────────────────────
#  ПРОГРЕВ
#
#  Серия сообщений после ПЕРВОГО бесплатного гайда. Отсчёт — от момента,
#  когда человек забрал свой первый гайд.
#
#  after           — через сколько: 30m (минуты), 24h (часы), 3d (дни)
#  skip_if_bought  — не отправлять тем, кто уже купил эти продукты
#  text, buttons   — как у экранов
#
#  Сообщения уходят только в nurture_hours по часовому поясу TIMEZONE из .env.
#  Каждый шаг человек получит один раз. Шаг, добавленный позже, получат только
#  те, кто забрал гайд недавно, — старую базу он не заспамит.
# ─────────────────────────────────────────────────────────────

nurture_hours: "10-21"

nurture:
  - id: n1_day1
    after: 24h
    text: |
      Как успехи с гайдом?

      Если ответ получился не тот — это нормально. Чаще всего хватает одной поправки: «сократи», «учти, что…», «сделай таблицей».

      Все десять поправок — в гайде 03.
    buttons:
      - {text: "🎁 Гайд 03 · 10 поправок", product: g03_fix}
      - {text: "✉️ Не получается — напиши мне", screen: contact}

  - id: n2_day3
    after: 3d
    skip_if_bought: [guide]
    text: |
      Бесплатные гайды дают результат на одной задаче.

      Дальше вопрос уже не «какой запрос скопировать», а «как собрать свой — под любую задачу». И как понять, где ответ врёт.

      Это «Нейросети с нуля»: 5 уроков по 20–30 минут.
    buttons:
      - {text: "📘 Посмотреть, что внутри", product: guide}

  - id: n3_day6
    after: 6d
    skip_if_bought: [prompts]
    text: |
      Не хочется каждый раз собирать запрос с нуля?

      В «Библиотеке запросов» 50 готовых шаблонов: поездки, покупки, сообщения, планы, уход за собой.
      Вставляешь своё — и поправлять приходится намного меньше 🤍
    buttons:
      - {text: "💬 Посмотреть шаблоны", product: prompts}


# ─────────────────────────────────────────────────────────────
#  СЛУЖЕБНЫЕ ТЕКСТЫ
# ─────────────────────────────────────────────────────────────

texts:
  my_purchases: |
    <b>Мои покупки</b>
    Нажми на продукт — пришлю ещё раз.

  my_empty: Покупок пока нет. Загляни в бесплатные гайды 🤍

  # {product} — название продукта
  thanks: |
    Оплата прошла, спасибо 🤍
    Держи <b>{product}</b>

  pay_prompt: Нажми «Оплатить». Продукт придёт в этот чат сразу после оплаты.

  # ── Выбор способа оплаты ── {product} — название
  pay_choose: Как удобнее оплатить <b>{product}</b>?

  # ── Tribute ── {product}, {amount}
  tribute_prompt: |
    <b>{product}</b> — {amount} ₽

    Оплата картой через Tribute.
    Сразу после оплаты Tribute пришлёт продукт в Telegram.

  # ── Перевод на карту ── {product}, {amount}, {order}, {details} (реквизиты из .env)
  transfer_prompt: |
    <b>{product}</b> — {amount} ₽

    Переведи <b>{amount} ₽</b> по реквизитам:
    {details}

    После перевода пришли сюда скриншот или файл чека — проверю поступление и пришлю продукт.
    Номер заказа: {order}

  transfer_received: |
    Чек по заказу №{order} у меня 🤍
    Проверю поступление и пришлю продукт сюда. Обычно это занимает несколько часов.

  transfer_rejected: |
    Перевод по заказу №{order} не нашёлся.
    Если деньги списались — напиши мне и приложи чек из банка, разберёмся.

  transfer_no_order: Если это чек об оплате — сначала выбери продукт и способ «Переводом на карту», потом пришли чек.

  # Перед чеком, который ты отправляешь покупателю ответом на заявку. {order}
  seller_receipt: "🧾 Чек об оплате заказа №{order}:"

  # Два текста ниже показываются во всплывающем окне — не длиннее 200 символов
  pay_waiting: Пока не вижу оплату. Если она уже прошла — подожди минуту и нажми ещё раз.
  pay_canceled: Платёж отменён. Можно открыть продукт заново и попробовать ещё раз.

  already_bought: Этот продукт у тебя уже есть — отправляю ещё раз.

  delivery_error: |
    Что-то пошло не так.
    Мне уже пришло уведомление — пришлю всё вручную. Деньги не потеряются.

  # Команда /paysupport обязательна по правилам Telegram для оплаты звёздами
  paysupport: |
    <b>Вопросы по оплате</b>
    Напиши мне @your_username и приложи скриншот оплаты — разберусь.
