# ─────────────────────────────────────────────────────────────
#  СЦЕНАРИИ — главное на старте
#
#  Человек отвечает на 1–4 вопроса кнопками и получает готовый запрос под себя.
#  Нейросеть внутри бота не нужна: ответы просто подставляются в prompt.
#
#  options       — варианты ответа (до 8). Если на кнопке одно, а в запрос
#                  нужно другое — {text: "Кнопка", value: "что подставить"}
#  prompt        — запрос: {1} — ответ на первый вопрос, {2} — на второй…
#                  [в квадратных скобках] — то, что человек допишет сам
#  after         — сообщение под запросом: мягкий переход к продукту
#  Кнопка, которая запускает сценарий: {text: "…", flow: trip}
# ─────────────────────────────────────────────────────────────

flows:

  trip:
    steps:
      - text: |
          <i>Сначала ощущение, потом прайс.</i>

          Что хочешь почувствовать в этой поездке?
        options:
          - {text: "Роскошь", value: "роскошь"}
          - {text: "Тишину", value: "тишину и покой"}
          - {text: "Приключение", value: "приключение"}
          - {text: "Море и тепло", value: "море и тепло"}
      - text: Сколько дней?
        options:
          - {text: "2–3 дня", value: "2–3 дня"}
          - {text: "4–5 дней", value: "4–5 дней"}
          - {text: "Неделю", value: "неделя"}
          - {text: "Дольше", value: "больше недели"}
      - text: Какой бюджет?
        options:
          - {text: "Скромный", value: "скромный"}
          - {text: "Средний", value: "средний"}
          - {text: "Вложусь в главное", value: "можно вложиться в главное"}
    result:
      text: Готово 🤍 Нажми на текст — он скопируется. Вставь в любую нейросеть.
      prompt: |
        Помоги спланировать поездку. Хочу почувствовать {1}. Длительность — {2}, бюджет — {3}.
        Предложи 3 направления под это ощущение и разложи бюджет таблицей в процентах.
        Экономим на статусе, а не на впечатлениях.
        Цены не выдумывай — в конце напиши, что проверить на официальных сайтах.
      after: |
        Хочешь, чтобы нейросеть считала так <b>всегда</b> — без этих объяснений?

        В «Личном ИИ-ассистенте» есть ассистент поездок с моими правилами. И ещё девять — для покупок, денег, сообщений и не только.
      buttons:
        - {text: "✨ Посмотреть ассистента · 490 ₽", product: guide}
        - {text: "🎁 Гайд 04 · Бюджет поездки — бесплатно", product: g04_trip}
        - {text: "↺ Решить ещё одну задачу", screen: tasks}

  buy:
    steps:
      - text: |
          <i>Одна хорошая вещь вместо пяти случайных.</i>

          Что выбираешь?
        options:
          - {text: "Технику", value: "технику"}
          - {text: "Одежду или обувь", value: "одежду или обувь"}
          - {text: "Для дома", value: "что-то для дома"}
          - {text: "Уход", value: "средство для ухода"}
      - text: Как часто будешь пользоваться?
        options:
          - {text: "Каждый день", value: "каждый день"}
          - {text: "Иногда", value: "время от времени"}
          - {text: "Для особого случая", value: "по особым случаям"}
      - text: Какой бюджет?
        options:
          - {text: "Скромный", value: "скромный"}
          - {text: "Средний", value: "средний"}
          - {text: "Вложусь, если надолго", value: "можно вложиться, если вещь прослужит долго"}
    result:
      text: Готово 🤍 Нажми на текст — он скопируется. Вставь в любую нейросеть.
      prompt: |
        Помоги выбрать {1}. Пользоваться буду {2}. Бюджет — {3}.
        Лучше одна хорошая вещь надолго, чем несколько дешёвых. Акция — не причина покупать.
        Сначала задай мне 2–3 уточняющих вопроса. Потом сравни 3 варианта таблицей: цена, срок службы, минусы.
        Цены и характеристики не выдумывай — скажи, что проверить.
      after: |
        Хочешь, чтобы нейросеть выбирала так <b>всегда</b>?

        В «Личном ИИ-ассистенте» есть ассистент покупок с моими правилами — и ещё девять.
      buttons:
        - {text: "✨ Посмотреть ассистента · 490 ₽", product: guide}
        - {text: "🎁 Гайд 01 · Сравнить покупку — бесплатно", product: g01_first}
        - {text: "↺ Решить ещё одну задачу", screen: tasks}

  money:
    steps:
      - text: |
          <i>Красивая жизнь считается.</i>

          Что хочешь сделать с деньгами?
        options:
          - {text: "Понять, куда уходят", value: "понять, куда уходят деньги"}
          - {text: "Накопить на цель", value: "накопить на цель: [цель] — за [срок]"}
          - {text: "Сократить траты без потерь", value: "сократить траты и не потерять в качестве жизни"}
      - text: Записи трат у тебя есть?
        options:
          - {text: "Есть, за месяц", value: "Вот мои траты за месяц: [вставь список]."}
          - {text: "Нет, начну с нуля", value: "Записей трат нет — сначала помоги понять, какие категории вести."}
    result:
      text: Готово 🤍 Нажми на текст — он скопируется. Вставь в любую нейросеть.
      prompt: |
        Помоги с личным бюджетом. Задача: {1}.
        {2}
        Сначала обязательное, потом приятное. Режем то, что не радует, а не то, ради чего живём. Кредиты и рассрочки не предлагай.
        Считай только по моим цифрам, а если их не хватает — спроси. Не советуй инвестиции и способы заработка.
      after: |
        Хочешь, чтобы нейросеть считала твой бюджет так <b>всегда</b>?

        В «Личном ИИ-ассистенте» есть ассистент бюджета — и ещё девять. А в «Библиотеке запросов» — готовые шаблоны про траты и цели.
      buttons:
        - {text: "✨ Посмотреть ассистента · 490 ₽", product: guide}
        - {text: "💬 Библиотека запросов · 290 ₽", product: prompts}
        - {text: "↺ Решить ещё одну задачу", screen: tasks}

  message:
    steps:
      - text: |
          <i>Утверждение, а не оправдание.</i>

          Что нужно сделать?
        options:
          - {text: "Отказать", value: "отказать"}
          - {text: "Напомнить про долг", value: "напомнить о долге"}
          - {text: "Попросить", value: "попросить о помощи"}
          - {text: "Обозначить границу", value: "обозначить границу"}
      - text: Кому пишешь?
        options:
          - {text: "Подруге", value: "подруге"}
          - {text: "Родственнику", value: "родственнику"}
          - {text: "По работе", value: "по рабочему вопросу"}
          - {text: "Малознакомому", value: "малознакомому человеку"}
      - text: Каким тоном?
        options:
          - {text: "Мягче", value: "мягкий"}
          - {text: "Ровно", value: "ровный"}
          - {text: "Твёрже", value: "твёрдый"}
    result:
      text: Готово 🤍 Нажми на текст — он скопируется. Допиши ситуацию и вставь в любую нейросеть.
      prompt: |
        Помоги написать сообщение: нужно {1}. Пишу {2}. Тон — {3}.
        Ситуация: [опиши в 1–2 предложениях].
        Коротко, без оправданий и лишних «извини». Говорим о ситуации, а не о человеке.
        Дай 3 варианта.
      after: |
        Хочешь, чтобы нейросеть писала так <b>всегда</b> — без оправданий и с тремя вариантами?

        В «Личном ИИ-ассистенте» есть ассистент сложных сообщений — и ещё девять.
      buttons:
        - {text: "✨ Посмотреть ассистента · 490 ₽", product: guide}
        - {text: "🎁 Гайд 05 · Неловкое сообщение — бесплатно", product: g05_message}
        - {text: "↺ Решить ещё одну задачу", screen: tasks}


# ─────────────────────────────────────────────────────────────
#  ПРОДУКТЫ
#
#  id           — латиница, цифры, _ и -, до 28 символов
#  free: true   — бесплатный: приходит сразу по нажатию кнопки
#  followup     — только у бесплатных: сообщение с кнопками,
#                 которое бот пришлёт сразу после гайда
#  price_rub    — цена в рублях (для ЮKassa)
#  price_stars  — цена в звёздах Telegram (для Stars)
#  description  — описание для карточки (обязательно у платных)
#  photo        — обложка карточки: файл из products/ или https-ссылка
#  delivery     — что человек получит:
#     type: file     value: products/guide.pdf
#     type: link     value: https-ссылка (Google Диск, Notion, платформа)
#     type: text     value: текст сообщения
#     type: channel  value: "-100XXXXXXXXXX" — одноразовое приглашение
#                    в закрытый канал (бот — админ с правом приглашать)
#
#  PDF гайдов собираются из guides/*.md командой: python guides/build.py
# ─────────────────────────────────────────────────────────────

