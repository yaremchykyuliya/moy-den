# ═════════════════════════════════════════════════════════════
#  Контент бота: экраны, кнопки, продукты, тексты.
#  Код трогать не нужно — всё собирается здесь.
#
#  После правки отправьте боту /reload — перезапуск не нужен.
#  Если в файле ошибка, бот скажет, где именно, и продолжит работать
#  на старой версии.
#
#  Оформление текста (HTML-теги Telegram):
#    <b>жирный</b>  <i>курсив</i>  <a href="https://...">ссылка</a>
#    Знак «меньше» пишите как &lt;  амперсанд как &amp;
#  {name} в тексте экрана заменится на имя человека.
#
#  ⚠️ Продукты, ссылки и @ник ниже — ЗАГЛУШКИ. Замените на свои.
# ═════════════════════════════════════════════════════════════


# ─────────────────────────────────────────────────────────────
#  ЭКРАНЫ
#
#  Каждый экран — текст + кнопки. Экран start — главное меню.
#  Кнопки идут рядами:
#    - {text: "Одна кнопка на всю ширину", screen: free}
#    - [{text: "Левая", screen: a}, {text: "Правая", screen: b}]
#
#  Что делает кнопка (ровно одно):
#    screen: id    — открыть другой экран
#    product: id   — бесплатный продукт сразу приходит в чат,
#                    платный открывает карточку с кнопкой «Купить»
#    url: https:// — открыть ссылку (в Telegram рядом появится ↗)
#    my: true      — «Мои покупки»
#
#  Прямая ссылка на любой экран или продукт для постов и рилсов:
#    https://t.me/ИМЯ_БОТА?start=free
#    https://t.me/ИМЯ_БОТА?start=free_start   ← гайд придёт сразу
# ─────────────────────────────────────────────────────────────

screens:

  start:
    text: |
      Здравствуйте, {name} 🤍

      Нейросети — это не про технологии. Это про время и решения.

      Здесь собрано, как начать с нуля и не утонуть в терминах.
      Бесплатное забирайте сразу, остальное — по шагам.
    buttons:
      - {text: "🎁 Бесплатно: гайды", screen: free}
      - {text: "🧭 С чего начать?", screen: quiz}
      - [{text: "📘 Нейросети с нуля", product: guide}, {text: "💬 Пакет промптов", product: prompts}]
      - [{text: "📖 Инструкции", screen: instructions}, {text: "❓ Вопросы", screen: faq}]
      - {text: "📦 Мои покупки", my: true}
      - {text: "✉️ Связь со мной", screen: contact}

  # ── Бесплатные материалы ──────────────────────────────────
  free:
    text: Забирайте 🤍
    buttons:
      - {text: "📘 Гайд: Первая неделя с нейросетью", product: free_start}
      - {text: "📘 10 запросов, которые экономят время", product: free_prompts}
      - {text: "🌐 Все материалы на сайте", url: "https://example.com"}
      - {text: "⬅️ В меню", screen: start}

  # ── Квиз «С чего начать?» ─────────────────────────────────
  quiz:
    text: |
      Один вопрос, чтобы не листать всё подряд.

      Что вам сейчас ближе?
    buttons:
      - {text: "Слышу про нейросети отовсюду, но не знаю, с чего начать", screen: q_start}
      - {text: "Хочу меньше времени тратить на рутину", screen: q_time}
      - {text: "Хочу быстрее решать: покупки, поездки, планы", screen: q_decide}
      - {text: "Хочу поговорить лично", screen: contact}
      - {text: "⬅️ В меню", screen: start}

  q_start:
    text: |
      Начните с бесплатного гайда.
      Первая неделя — без терминов и сложных настроек.

      Зайдёт — дальше «Нейросети с нуля».
    buttons:
      - {text: "🎁 Забрать гайд", product: free_start}
      - {text: "📘 Нейросети с нуля", product: guide}
      - {text: "⬅️ Назад", screen: quiz}

  q_time:
    text: |
      Рутину забирают готовые запросы.
      Скопировали, вставили, получили результат.

      Для начала — десять бесплатных.
    buttons:
      - {text: "🎁 10 запросов бесплатно", product: free_prompts}
      - {text: "💬 Пакет промптов", product: prompts}
      - {text: "⬅️ Назад", screen: quiz}

  q_decide:
    text: |
      Ноутбук для работы я выбирала так: попросила нейросеть сравнить модели под мой бюджет.
      Без часов в отзывах.

      Так же считаются поездки, покупки и планы. Голова решает.
    buttons:
      - {text: "🎁 Начать бесплатно", product: free_start}
      - {text: "📘 Нейросети с нуля", product: guide}
      - {text: "⬅️ Назад", screen: quiz}

  # ── Инструкции ────────────────────────────────────────────
  instructions:
    text: |
      <b>Инструкции</b>

      Каждый шаг — от «что такое нейросеть» до «отвечает не то».
      Написано просто.

      Не нашли ответ — напишите мне и приложите скриншот.
    buttons:
      - {text: "🧠 Совсем с нуля", screen: i_zero}
      - {text: "📱 Регистрация", screen: i_account}
      - {text: "✍️ Как писать запросы", screen: i_prompts}
      - {text: "🔧 Если что-то не работает", screen: i_fix}
      - {text: "⬅️ В меню", screen: start}

  i_zero:
    text: |
      <b>Совсем с нуля</b>

      Нейросеть — программа, с которой общаются обычным текстом.
      Вы пишете задачу, она отвечает.

      Устанавливать ничего не нужно: большинство работают в браузере или в приложении на телефоне.

      Первый шаг — простой вопрос из своей жизни.
      Не «напиши эссе», а «составь меню на неделю из того, что есть в холодильнике».
    buttons:
      - {text: "⬅️ К инструкциям", screen: instructions}

  # ЗАГЛУШКА: впишите регистрацию в той нейросети, которой учите
  i_account:
    text: |
      <b>Регистрация</b>

      Скоро здесь будет пошаговая регистрация — со скриншотами каждого шага.
    buttons:
      - {text: "⬅️ К инструкциям", screen: instructions}

  i_prompts:
    text: |
      <b>Как писать запросы</b>

      Хороший запрос отвечает на четыре вопроса:
      1. Кто вы для нейросети — «ты опытный турагент»
      2. Что сделать — «собери маршрут на 3 дня»
      3. Условия — «бюджет, двое взрослых, без ранних подъёмов»
      4. В каком виде — «таблицей по дням»

      Чем больше условий, тем меньше переделок.
    buttons:
      - {text: "⬅️ К инструкциям", screen: instructions}

  i_fix:
    text: |
      <b>Отвечает не то</b>

      Чаще всего задача описана слишком коротко.

      1. Добавьте, для кого и зачем
      2. Попросите формат: список, таблица, пять вариантов
      3. Уточните в том же чате: «короче», «проще», «без терминов»

      Не помогло — напишите мне и приложите скриншот.
    buttons:
      - {text: "✉️ Написать", screen: contact}
      - {text: "⬅️ К инструкциям", screen: instructions}

  # ── Вопросы ───────────────────────────────────────────────
  faq:
    text: |
      <b>Вопросы</b>

      <b>Нужно платить за нейросеть?</b>
      Для старта хватает бесплатных версий.

      <b>Когда придёт покупка?</b>
      Сразу после оплаты, в этот чат.

      <b>Потерялся файл?</b>
      Он всегда лежит в «Моих покупках».
    buttons:
      - {text: "📦 Мои покупки", my: true}
      - {text: "✉️ Не нашли ответ", screen: contact}
      - {text: "⬅️ В меню", screen: start}

  # ── Связь ─────────────────────────────────────────────────
  contact:
    text: |
      Пишите напрямую — отвечаю в течение дня.
    buttons:
      - {text: "✉️ Написать мне", url: "https://t.me/your_username"}
      - {text: "⬅️ В меню", screen: start}

  # Пример партнёрской программы, как «Заработать со мной» у NIKSHEN.
  # Раскомментируйте и добавьте кнопку {text: "🤝 Заработать со мной", screen: partners} в start.
  # partners:
  #   text: |
  #     <b>Заработать со мной</b>
  #
  #     Рассказываете о моих продуктах — получаете процент с каждой продажи.
  #     Условия целиком — по ссылке.
  #   buttons:
  #     - {text: "📄 Читать условия", url: "https://example.com/partners"}
  #     - {text: "✉️ Написать и получить код", url: "https://t.me/your_username"}
  #     - {text: "⬅️ В меню", screen: start}


# ─────────────────────────────────────────────────────────────
#  ПРОДУКТЫ
#
#  id           — латиница, цифры, _ и -, до 28 символов
#  free: true   — бесплатный: приходит сразу по нажатию кнопки
#  price_rub    — цена в рублях (для ЮKassa)
#  price_stars  — цена в звёздах Telegram (для Stars)
#  description  — описание для карточки (обязательно у платных)
#  photo        — обложка карточки: файл из products/ или https-ссылка
#  delivery     — что человек получит:
#     type: file     value: products/guide.pdf
#     type: link     value: https-ссылка (Google Диск, Notion, платформа)
#     type: text     value: текст сообщения
#     type: channel  value: "-100XXXXXXXXXX" — одноразовое приглашение
#                    в закрытый канал (бот — админ с правом приглашать)
# ─────────────────────────────────────────────────────────────

products:

  # ── Бесплатные ────────────────────────────────────────────
  - id: free_start
    title: "Гайд: Первая неделя с нейросетью"
    free: true
    delivery:
      type: link
      value: https://example.com/zamenite-na-svoyu-ssylku

  - id: free_prompts
    title: 10 запросов, которые экономят время
    free: true
    delivery:
      type: link
      value: https://example.com/zamenite-na-svoyu-ssylku

  # ── Платные ───────────────────────────────────────────────
  - id: guide
    title: Нейросети с нуля
    description: |
      Пошаговый гайд для тех, кто ни разу не открывал нейросеть.

      Внутри:
      • как зарегистрироваться и не запутаться
      • 20 готовых запросов для работы и жизни
      • частые ошибки новичков
    price_rub: 990
    price_stars: 500
    delivery:
      type: link
      value: https://example.com/zamenite-na-svoyu-ssylku

  - id: prompts
    title: Пакет промптов
    description: |
      50 проверенных запросов: тексты, поездки, покупки, планы.
      Скопировали — вставили — получили результат.
    price_rub: 490
    price_stars: 250
    delivery:
      type: link
      value: https://example.com/zamenite-na-svoyu-ssylku


# ─────────────────────────────────────────────────────────────
#  СЛУЖЕБНЫЕ ТЕКСТЫ
# ─────────────────────────────────────────────────────────────

texts:
  my_purchases: |
    <b>Мои покупки</b>
    Нажмите на продукт — пришлю ещё раз.

  my_empty: Покупок пока нет. Загляните в бесплатные гайды 🤍

  # {product} — название продукта
  thanks: |
    Оплата прошла, спасибо 🤍
    Держите <b>{product}</b>

  pay_prompt: Нажмите «Оплатить». Продукт придёт в этот чат сразу после оплаты.

  # Два текста ниже показываются во всплывающем окне — не длиннее 200 символов
  pay_waiting: Пока не вижу оплату. Если оплата уже прошла — подождите минуту и нажмите ещё раз.
  pay_canceled: Платёж отменён. Можно открыть продукт заново и попробовать ещё раз.

  already_bought: Этот продукт у вас уже есть — отправляю ещё раз.

  delivery_error: |
    Что-то пошло не так.
    Мне уже пришло уведомление — пришлю всё вручную. Деньги не потеряются.

  # Команда /paysupport обязательна по правилам Telegram для оплаты звёздами
  paysupport: |
    <b>Вопросы по оплате</b>
    Напишите мне @your_username и приложите скриншот оплаты — разберусь.
